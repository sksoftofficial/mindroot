<title>Mindroot</title>
<style>

  .editor-actions .danger:hover { border-color:transparent }
  .back-button { background:transparent; border-color:transparent; color:var(--dim) }
  .back-button:hover { background:var(--hover); border-color:transparent; color:var(--fg) }
  .editor-title { display:block; max-width:100% }
  .md { padding:32px; line-height:1.85; border-radius:10px }
  .split > .md, .split > textarea { min-width:0 }
  .md p, .md li { overflow-wrap:anywhere }
  .split.preview .md { padding:32px }
  .md h1 { letter-spacing:-.035em; font-size:30px }
  .md h2 { margin-top:30px }
  .md blockquote { padding:8px 16px; background:#e9973f05 }
  textarea.editor { padding:22px; line-height:1.8 }
  textarea.editor:focus { border-color:var(--border); box-shadow:none; outline:none }
  .graph-workspace { border-radius:10px }
  .proj[hidden], .docrow[hidden], .rem[hidden], .empty[hidden] { display:none }
  @media (min-width:701px) {
    aside.collapsed { width:64px; padding:62px 8px 18px }
    aside.collapsed .sidebar-toggle { right:17px }
    aside.collapsed .project-search, aside.collapsed .project-name, aside.collapsed .sidebar-item { display:none }
    aside.collapsed #projList { padding:0; gap:6px }
    aside.collapsed #projList[hidden] { display:flex }
    aside.collapsed .proj { justify-content:center; padding:10px 0; min-height:44px }
    aside.collapsed .proj::before { font-size:11px }
  }
  @media (min-width:1600px) { #content { padding-left:max(38px,calc((100vw - 1600px)/2)); padding-right:max(38px,calc((100vw - 1600px)/2)) } }
  @media (max-width:1000px) { #content { padding:24px } aside { width:220px } .brand { min-width:182px } .collection-grid { grid-template-columns:1fr } }
  @media (max-width:700px) {
    header { height:68px; padding:12px 16px; gap:12px }
    .brand { min-width:0 } header h1 { font-size:18px }
    .brand-mark, .brand-logo { width:32px; height:32px }
    aside { width:100%; padding:4px 16px; max-height:none; gap:0 }
    #projectMenu { display:none }
    .mobile-project-picker { display:flex; align-items:center; gap:16px; min-width:0 }
    .mobile-project-picker span { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); flex:none }
    .mobile-project-picker select { flex:1; min-width:0; width:0; background:var(--bg2); color:var(--fg); border:0; padding:8px; font:inherit; font-size:13px; min-height:44px }
    .sidebar-toggle { display:none }
    .project-search { margin:4px 0 8px; padding:6px 10px }
    #projList { margin:0; gap:5px; overflow-y:hidden; padding:0 }
    #content { padding:20px 16px 16px }
    .workspace-intro { margin-bottom:16px }
    .workspace-intro h2 { font-size:24px }
    .workspace-intro p { display:none }
    .workspace-head { gap:6px; margin-bottom:18px }
    .tabs, .viewmode { gap:18px } .tab, .viewmode button { padding:10px 0 }
    .project-actions { padding-bottom:0 }
    .delete-project { width:44px; height:44px; display:grid; place-items:center }
    .delete-project svg { display:block }
    .delete-project span { display:none }
    .collection-toolbar { gap:12px }
    .collection-toolbar h3 { flex:none }
    .collection-toolbar input { width:0; flex:1; min-width:0 }
    .docrow, .rem { padding:18px }
    .rem { gap:10px }
    .rem > button { width:44px; height:44px }
    .doc-head { flex-wrap:wrap; gap:6px }
    .split.preview .md, .md { padding:24px 20px }
    .editor-title { max-width:140px }
    .editor-actions { gap:5px }
    .editor-actions button { min-height:44px; padding:7px 10px }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { transition:none !important } }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg class="brand-logo" viewBox="0 0 40 40" fill="none"><path d="M20 18v17m0-10-8 6m8-6 8 6" stroke="#e9973f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 21C10 21 5 15 6 7c8-1 14 4 14 14Z" fill="#e9973f"/><path d="M22 17C22 9 27 4 35 5c0 8-5 13-13 12Z" fill="#f2bd7e"/></svg>
    </span>
    <div class="brand-copy">
      <h1>mindroot</h1>
      <span class="brand-subtitle">Persistent memory</span>
    </div>
  </div>
  <div class="spacer"></div>
  <button class="header-lock" type="button" onclick="logout()" title="Lock dashboard" aria-label="Lock dashboard">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="5" y="10" width="14" height="10" rx="2" stroke-width="1.8"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="header-lock-label">Lock</span>
  </button>
</header>

<div id="gate">
  <h2 style="margin:0">API key required</h2>
  <p class="muted">Find it in <b>~/.mindroot/config.json</b> or in the output of <b>mindroot init</b>.</p>
  <input id="keyInput" type="password" placeholder="paste API key" onkeydown="if(event.key==='Enter')unlock()">
  <button class="primary" onclick="unlock()">Unlock</button>
  <p id="gateErr" class="err"></p>
</div>

<main id="app" style="display:none">
  <aside>
    <label class="mobile-project-picker"><span>Project</span><select id="mobileProject" aria-label="Choose project" onchange="selectProject(this.value)"></select></label>
    <button class="sidebar-toggle" type="button" title="Shrink menu" aria-label="Shrink menu" aria-expanded="true" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m14 7-5 5 5 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div id="projectMenu">
      <button class="sidebar-item" id="projectMenuToggle" type="button" title="Projects" aria-label="Projects" aria-expanded="true" aria-controls="projList" onclick="toggleProjectMenu()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7h7l2 2h9v11H3zM3 7V4h7l2 3" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span class="sidebar-label">Projects</span>
        <svg class="menu-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input class="project-search" type="search" placeholder="Find a project…" aria-label="Find a project" oninput="filterProjects()">
      <div id="projList"></div>
      <p class="project-empty" role="status" hidden>No projects match.</p>
    </div>
  </aside>
  <section id="content"></section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let KEY = localStorage.getItem("mindroot_key") || "";
let currentProject = null;
let currentTab = "notes";
let currentDoc = null;
let activeHash = "";
let disposeGraph = null;

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { authorization: "Bearer " + KEY, "content-type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401) { showGate("wrong key"); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.status), { status: res.status });
  return data;
}

function showGate(msg) {
  disposeGraph?.();
  disposeGraph = null;
  $("#app").style.display = "none";
  $("#gate").style.display = "flex";
  if (msg) $("#gateErr").textContent = msg;
}
function unlock() {
  KEY = $("#keyInput").value.trim();
  localStorage.setItem("mindroot_key", KEY);
  boot();
}
function logout() {
  localStorage.removeItem("mindroot_key");
  location.reload();
}

async function boot() {
  try {
    await api("GET", "/api/projects");
    $("#gate").style.display = "none";
    $("#app").style.display = "flex";
    const projects = await renderProjects();
    const r = routeFromHash();
    if (projects.some((p) => p.slug === r.slug)) applyRoute(r);
    else if (projects.length) navTo("#/" + encodeURIComponent(projects[0].slug) + "/notes");
    else applyRoute(r);
  } catch (e) {
    if (e.message !== "unauthorized") showGate(String(e));
  }
}

function routeUrl(slug, tab, doc) {
  return "#/" + encodeURIComponent(slug) + "/" + tab + (doc ? "/" + encodeURIComponent(doc) : "");
}

function routeFromHash() {
  const [rawSlug, rawTab, rawDoc] = location.hash.replace(/^#\/?/, "").split("/");
  if (!rawSlug) return { slug: null };
  return {
    slug: decodeURIComponent(rawSlug),
    tab: ["notes", "memories", "skills", "graph"].includes(rawTab) ? rawTab : "notes",
    doc: rawDoc ? decodeURIComponent(rawDoc) : null,
  };
}

function navTo(hash) {
  if (location.hash === hash) applyRoute(routeFromHash());
  else location.hash = hash;
}

function applyRoute({ slug = null, tab = "notes", doc = null } = {}) {
  disposeGraph?.();
  disposeGraph = null;
  activeHash = location.hash || "#/";
  currentProject = slug;
  $("#mobileProject").value = slug || "";
  currentTab = tab;
  currentDoc = doc;
  document.querySelectorAll(".proj").forEach((n) => {
    n.classList.toggle("active", n.dataset.slug === slug);
    if (n.dataset.slug === slug) n.setAttribute("aria-current", "page");
    else n.removeAttribute("aria-current");
  });
  if (slug) setProjectMenu(true);
  if (!slug) {
    const c = $("#content");
    c.innerHTML = '<div class="view"><div class="empty">No projects yet. Agents create them automatically on first write.</div></div>';
    return;
  }
  renderTabs();
}

window.addEventListener("hashchange", () => applyRoute(routeFromHash()));

async function renderProjects() {
  const rows = await api("GET", "/api/projects");
  const picker = $("#mobileProject");
  picker.replaceChildren(...rows.map((r) => new Option(r.slug, r.slug)));
  picker.disabled = !rows.length;
  if (!rows.length) picker.add(new Option("No projects yet", ""));
  if (currentProject) picker.value = currentProject;
  const el = $("#projList");
  el.innerHTML = "";
  for (const r of rows) {
    const div = document.createElement("button");
    div.type = "button";
    div.className = "proj" + (r.slug === currentProject ? " active" : "");
    div.dataset.slug = r.slug;
    div.setAttribute("aria-label", r.slug);
    div.dataset.initial = r.slug.slice(0, 2).toUpperCase();
    const name = document.createElement("span");
    name.className = "project-name";
    name.textContent = r.slug;
    div.appendChild(name);
    div.title = r.slug + " · " + r.docs + " notes, " + r.memories + " memories, " + (r.skills || 0) + " skills";
    div.onclick = () => selectProject(r.slug);
    el.appendChild(div);
  }
  if (!rows.length) el.innerHTML = '<p class="muted">No projects yet</p>';
  filterProjects();
  return rows;
}

function filterProjects() {
  const query = $(".project-search").value.trim().toLowerCase();
  const rows = [...document.querySelectorAll(".proj")];
  rows.forEach((row) => { row.hidden = !row.dataset.slug.toLowerCase().includes(query); });
  $(".project-empty").hidden = !query || rows.some((row) => !row.hidden);
}

function selectProject(slug) {
  navTo(routeUrl(slug, "notes"));
}

function renderTabs() {
  disposeGraph?.();
  disposeGraph = null;
  const c = $("#content");
  c.innerHTML = "";
  if (!(["notes", "skills"].includes(currentTab) && currentDoc !== null)) {
    const intro = document.createElement("div");
    intro.className = "workspace-intro";
    intro.innerHTML = '<h2></h2><div class="eyebrow">Project workspace</div>';
    intro.querySelector("h2").textContent = currentProject;
    c.appendChild(intro);
    const head = document.createElement("div");
    head.className = "workspace-head";
    const tabs = document.createElement("div");
    tabs.className = "tabs";
    for (const [name, label] of [["notes","Notes"],["memories","Memories"],["skills","Skills"],["graph","Graph"]]) {
      const t = document.createElement("button");
      t.type = "button";
      if (currentTab === name) t.setAttribute("aria-current", "page");
      t.className = "tab" + (currentTab === name ? " active" : "");
      t.textContent = label;
      t.onclick = () => navTo(routeUrl(currentProject, name));
      tabs.appendChild(t);
    }
    const actions = document.createElement("div");
    actions.className = "project-actions";
    actions.innerHTML = '<button class="danger delete-project" aria-label="Delete project" title="Delete project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg><span>Delete project</span></button>';
    actions.querySelector("button").onclick = deleteCurrentProject;
    head.append(tabs, actions);
    c.appendChild(head);
  }
  const view = document.createElement("div");
  view.className = "view";
  c.appendChild(view);
  ({notes:renderNotes, memories:renderMemories, skills:renderSkills, graph:renderGraph}[currentTab])(view).catch((e) => {
    if (!view.isConnected) return;
    view.innerHTML = '<div class="empty err"></div>';
    view.firstChild.textContent = "Unable to load this view: " + e.message;
  });
}

async function renderGraph(view) {
  const slug = currentProject;
  view.innerHTML = '<div class="empty" role="status">Loading project graph...</div>';
  const [data, { mountGraph }] = await Promise.all([
    api("GET", "/api/projects/" + encodeURIComponent(slug)),
    import("/graph.js"),
  ]);
  if (!view.isConnected || currentTab !== "graph") return;
  const dispose = await mountGraph(view, data);
  if (!view.isConnected || currentTab !== "graph") dispose?.();
  else disposeGraph = dispose;
}

async function deleteCurrentProject() {
  const slug = currentProject;
  if (!slug || !confirm('Delete project "' + slug + '"?\n\nAll notes, memories, skills, and revision history for this project will be permanently removed.')) return;
  try {
    await api("DELETE", "/api/projects/" + encodeURIComponent(slug));
    currentProject = null;
    currentDoc = null;
    history.replaceState(null, "", location.pathname + location.search);
    const rows = await renderProjects();
    if (rows.length) navTo(routeUrl(rows[0].slug, "notes"));
    else applyRoute(routeFromHash());
    toast('project "' + slug + '" deleted');
  } catch (e) {
    toast("delete failed: " + e.message, true);
  }
}

async function renderNotes(view) {
  const docs = await api("GET", "/api/projects/" + currentProject + "/docs");
  if (!view.isConnected) return;
  if (currentDoc !== null) return renderEditor(view, docs);
  view.classList.add("collection-grid");
  for (const d of docs) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "docrow";
    row.innerHTML = '<div class="doc-head"><div class="t"></div><div class="p">' + d.sections.length + ' sections</div></div>';
    row.querySelector(".t").textContent = d.title + " ";
    const path = document.createElement("span");
    path.className = "note-path";
    path.textContent = d.path;
    row.appendChild(path);
    const chips = d.sections.filter(Boolean).map((s) => '<span class="sec-chip">' + esc(s) + "</span>").join("");
    row.insertAdjacentHTML("beforeend", '<div>' + chips + "</div>");
    row.onclick = () => navTo(routeUrl(currentProject, "notes", d.path));
    view.appendChild(row);
  }
  if (!docs.length) view.innerHTML = '<div class="empty">No notes yet. Agents create them with <b>mindroot_save_note</b>.</div>';
  addCollectionToolbar(view, "Notes", docs.length);
}

function addCollectionToolbar(view, label, count) {
  const toolbar = document.createElement("div");
  toolbar.className = "collection-toolbar";
  toolbar.innerHTML = '<h3>' + label + '<span class="collection-count">' + count + '</span></h3><input type="search" placeholder="Filter ' + label.toLowerCase() + '…" aria-label="Filter ' + label.toLowerCase() + '">';
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.hidden = true;
  empty.setAttribute("role", "status");
  empty.textContent = "No matches. Try a different search.";
  toolbar.querySelector("input").oninput = (event) => {
    const query = event.target.value.trim().toLowerCase();
    let visible = 0;
    view.querySelectorAll(".docrow, .rem").forEach((row) => {
      row.hidden = !row.textContent.toLowerCase().includes(query);
      if (!row.hidden) visible++;
    });
    toolbar.querySelector(".collection-count").textContent = query ? visible + " / " + count : count;
    empty.hidden = visible > 0 || count === 0;
  };
  view.prepend(toolbar);
  view.appendChild(empty);
}

let mdMode = localStorage.getItem("mindroot_mdmode") || "preview";

let sidebarCollapsed = localStorage.getItem("mindroot_sidebar") === "collapsed";
function toggleSidebar() { setSidebar(!sidebarCollapsed); }
function setSidebar(collapsed) {
  sidebarCollapsed = collapsed;
  if (collapsed) { $(".project-search").value = ""; filterProjects(); }
  localStorage.setItem("mindroot_sidebar", collapsed ? "collapsed" : "expanded");
  applySidebar();
}
function applySidebar() {
  const aside = document.querySelector("main aside");
  const btn = $(".sidebar-toggle");
  aside.classList.toggle("collapsed", sidebarCollapsed);
  btn.setAttribute("aria-expanded", String(!sidebarCollapsed));
  const label = sidebarCollapsed ? "Expand menu" : "Shrink menu";
  btn.title = label;
  btn.setAttribute("aria-label", label);
}
applySidebar();

let projectMenuExpanded = localStorage.getItem("mindroot_project_menu") !== "collapsed";
function toggleProjectMenu() { setProjectMenu(!projectMenuExpanded); }
function setProjectMenu(expanded) {
  projectMenuExpanded = expanded;
  localStorage.setItem("mindroot_project_menu", expanded ? "expanded" : "collapsed");
  $("#projectMenuToggle").setAttribute("aria-expanded", String(expanded));
  $("#projList").hidden = !expanded;
  $(".project-search").hidden = !expanded;
  if (!expanded) $(".project-empty").hidden = true;
  else filterProjects();
}
setProjectMenu(projectMenuExpanded);

function renderMd(text) {
  if (window.marked && window.DOMPurify) {
    marked.setOptions({ gfm: true, breaks: true });
    return DOMPurify.sanitize(marked.parse(text));
  }
  return '<p class="muted">markdown renderer unavailable (offline)</p><pre>' + esc(text) + "</pre>";
}

async function renderEditor(view, docs) {
  view.className = "view editor-view";
  const doc = await api("GET", "/api/projects/" + currentProject + "/doc?path=" + encodeURIComponent(currentDoc));
  const head = document.createElement("div");
  head.className = "editor-head";
  head.innerHTML =
    '<div class="editorbar"><div class="editor-identity">' +
    '<button class="back-button" id="backBtn" title="Back to notes" aria-label="Back to notes">' +
    '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
    '<div class="editor-document"><span class="editor-title"></span></div></div>' +
    '<span class="viewmode">' +
    [["edit","Write"],["split","Split"],["preview","Read"]].map(([mode, label]) =>
      '<button data-m="' + mode + '" aria-pressed="' + (mdMode === mode) + '" class="' + (mdMode === mode ? "on" : "") + '">' + label + "</button>").join("") +
    '</span>' +
    '<div class="editor-actions"><button class="primary" id="saveBtn">Save</button>' +
    '<button class="danger" id="delBtn">Delete note</button></div></div>';
  view.appendChild(head);
  head.querySelector(".editor-title").textContent = currentDoc;
  $("#backBtn").onclick = () => history.back();
  head.querySelectorAll(".viewmode button").forEach((b) =>
    b.onclick = () => { mdMode = b.dataset.m; localStorage.setItem("mindroot_mdmode", mdMode); renderTabs(); });

  const wrap = document.createElement("div");
  wrap.className = "split " + mdMode;
  const ta = document.createElement("textarea");
  ta.className = "editor";
  ta.setAttribute("aria-label", "Note content");
  ta.value = doc.content;
  ta.spellcheck = false;
  let prev = null;
  if (mdMode !== "edit") {
    prev = document.createElement("div");
    prev.className = "md";
  }
  const paint = () => {
    if (!prev) return;
    prev.innerHTML = renderMd(ta.value);
    prev.querySelectorAll("a img").forEach((img) => { img.draggable = false; });
  };
  let t;
  ta.oninput = () => { clearTimeout(t); t = setTimeout(paint, 150); };
  if (prev) {
    paint();
    if (mdMode === "split") wrap.append(ta, prev);
    else wrap.appendChild(prev);
  } else wrap.appendChild(ta);
  view.appendChild(wrap);
  $("#saveBtn").onclick = async () => {
    try {
      await api("PUT", "/api/projects/" + currentProject + "/doc?path=" + encodeURIComponent(currentDoc), { content: ta.value });
      toast("saved & reindexed");
    } catch (e) { toast("save failed: " + e.message, true); }
  };
  $("#delBtn").onclick = async () => {
    if (!confirm("delete " + currentDoc + "?")) return;
    await api("DELETE", "/api/projects/" + currentProject + "/doc?path=" + encodeURIComponent(currentDoc));
    navTo(routeUrl(currentProject, "notes"));
  };
}

async function renderMemories(view) {
  const rows = await api("GET", "/api/projects/" + currentProject + "/memories");
  if (!view.isConnected) return;
  for (const r of rows) {
    const div = document.createElement("div");
    div.className = "rem";
    const link = r.target_path ? '<a href="#" data-p="' + esc(r.target_path.split("::")[0]) + '">' + esc(r.target_path) + "</a>" : "";
    div.innerHTML = '<div class="txt"><div class="txt-main"></div>' +
      (link ? "<div>" + link + "</div>" : "") +
      '<div class="meta">#' + r.id + " · " + r.target_type + " · " + new Date(r.updated_at).toISOString().slice(0,16).replace("T"," ") + "</div></div>";
    div.querySelector(".txt-main").textContent = r.text;
    const del = document.createElement("button");
    del.className = "danger";
    del.title = "Delete memory";
    del.setAttribute("aria-label", "Delete memory #" + r.id);
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>';
    del.onclick = async () => { await api("DELETE", "/api/projects/" + currentProject + "/memories/" + r.id); renderTabs(); };
    div.appendChild(del);
    view.appendChild(div);
  }
  if (!rows.length) view.insertAdjacentHTML("beforeend", '<div class="empty">No memories yet</div>');
  addCollectionToolbar(view, "Memories", rows.length);
  view.querySelectorAll("a[data-p]").forEach((a) =>
    a.onclick = (e) => { e.preventDefault(); navTo(routeUrl(currentProject, "notes", a.dataset.p)); });
}

async function renderSkills(view) {
  const slug = currentProject;
  if (currentDoc !== null) return renderSkillEditor(view, slug, currentDoc);
  const rows = await api("GET", "/api/projects/" + encodeURIComponent(slug) + "/skills");
  if (!view.isConnected) return;
  view.classList.add("collection-grid");
  for (const skill of rows) {
    const row = document.createElement("button");
    row.className = "docrow skillrow";
    row.innerHTML = '<div class="doc-head"><span class="t"></span><span class="p"></span></div><div class="skill-summary"></div>';
    row.querySelector(".t").textContent = skill.name;
    row.querySelector(".p").textContent = "Revision " + skill.revision;
    row.querySelector(".skill-summary").textContent = skill.description;
    row.onclick = () => navTo(routeUrl(slug, "skills", skill.name));
    view.appendChild(row);
  }
  if (!rows.length) view.innerHTML = '<div class="empty">No skills yet. Saved procedures from your agents will appear here.</div>';
  addCollectionToolbar(view, "Skills", rows.length);
}

async function renderSkillEditor(view, slug, name) {
  const url = "/api/projects/" + encodeURIComponent(slug) + "/skills/" + encodeURIComponent(name);
  let skill = await api("GET", url);
  if (!view.isConnected) return;
  view.className = "view editor-view";
  const head = document.createElement("div");
  head.className = "editor-head";
  head.innerHTML =
    '<div class="editorbar"><div class="editor-identity">' +
    '<button class="back-button" title="Back to skills" aria-label="Back to skills">' +
    '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
    '<div class="editor-document"><span class="editor-title"></span></div></div>' +
    '<span class="viewmode"><button data-m="edit">Write</button><button data-m="split">Split</button><button data-m="preview">Read</button></span>' +
    '<div class="editor-actions"><button class="primary skill-save">Save</button><button class="danger skill-delete">Delete skill</button></div></div>' +
    '<div class="skill-fields"><div class="skill-history"><label for="skillRevision">Revision</label><select id="skillRevision"></select><span class="skill-status" role="status"></span></div>' +
    '<label class="skill-description-field" for="skillDescription">Description<input id="skillDescription" maxlength="2000" required></label><p class="skill-description"></p></div>';
  head.querySelector(".editor-title").textContent = name;
  head.querySelector(".editor-title").title = name;
  const revision = head.querySelector("select");
  const description = head.querySelector("input");
  const save = head.querySelector(".skill-save");
  const del = head.querySelector(".skill-delete");
  const status = head.querySelector(".skill-status");
  const wrap = document.createElement("div");
  const ta = document.createElement("textarea");
  ta.className = "editor";
  ta.setAttribute("aria-label", "Skill instructions");
  ta.spellcheck = false;
  const preview = document.createElement("div");
  preview.className = "md";
  let mode = "preview";
  let busy = false;
  const dirty = () => description.value !== skill.description || ta.value !== skill.content;
  const paint = () => { preview.innerHTML = renderMd(ta.value); };
  const setMode = () => {
    const historical = skill.revision !== skill.current_revision;
    const shownMode = historical ? "preview" : mode;
    wrap.className = "split " + shownMode;
    wrap.replaceChildren(...(shownMode === "edit" ? [ta] : shownMode === "split" ? [ta, preview] : [preview]));
    head.querySelector(".viewmode").hidden = historical;
    head.querySelectorAll(".viewmode button").forEach((b) => {
      b.classList.toggle("on", b.dataset.m === shownMode);
      b.setAttribute("aria-pressed", String(b.dataset.m === shownMode));
    });
    head.querySelector(".skill-description-field").hidden = shownMode === "preview";
    head.querySelector(".skill-description").hidden = shownMode !== "preview";
    head.querySelector(".skill-description").textContent = description.value;
    save.hidden = historical;
    del.hidden = historical;
    paint();
  };
  const load = (value) => {
    skill = value;
    description.value = skill.description;
    ta.value = skill.content;
    revision.replaceChildren();
    for (let n = skill.current_revision; n >= 1; n--) {
      revision.add(new Option("Revision " + n + (n === skill.current_revision ? " (latest)" : ""), String(n)));
    }
    revision.value = String(skill.revision);
    status.textContent = (skill.revision === skill.current_revision ? "Updated " : "Read-only · Saved ") + new Date(skill.updated_at).toLocaleString();
    setMode();
  };
  const setBusy = (value) => {
    busy = value;
    save.disabled = del.disabled = revision.disabled = description.disabled = ta.disabled = value;
  };
  head.querySelector(".back-button").onclick = () => {
    if (!busy && (!dirty() || confirm("Discard unsaved skill changes?"))) navTo(routeUrl(slug, "skills"));
  };
  head.querySelectorAll(".viewmode button").forEach((b) => {
    b.onclick = () => { mode = b.dataset.m; setMode(); };
  });
  ta.oninput = paint;
  revision.onchange = async () => {
    const selected = Number(revision.value);
    if (dirty() && !confirm("Discard unsaved skill changes?")) { revision.value = String(skill.revision); return; }
    setBusy(true);
    try {
      const value = await api("GET", url + (selected === skill.current_revision ? "" : "?revision=" + selected));
      if (view.isConnected) load(value);
    } catch (e) { revision.value = String(skill.revision); toast("Unable to load revision: " + e.message, true); }
    finally { setBusy(false); }
  };
  save.onclick = async () => {
    if (busy) return;
    if (!description.value.trim() || !ta.value.trim()) { toast("Description and instructions are required", true); return; }
    setBusy(true);
    try {
      const updated = await api("PUT", url, { description: description.value, content: ta.value, expected_revision: skill.revision });
      if (view.isConnected) load({ ...skill, ...updated, content: ta.value, current_revision: updated.revision });
      toast(updated.unchanged ? "No changes to save" : "Skill saved");
    } catch (e) { toast("Save failed: " + e.message + ". Your edits are still here.", true); }
    finally { setBusy(false); }
  };
  del.onclick = async () => {
    if (busy || !confirm('Delete skill "' + name + '" and all its revisions?')) return;
    setBusy(true);
    try {
      await api("DELETE", url);
      if (view.isConnected) navTo(routeUrl(slug, "skills"));
      await renderProjects();
      toast("Skill deleted");
    } catch (e) { toast("Delete failed: " + e.message, true); }
    finally { setBusy(false); }
  };
  view.append(head, wrap);
  load(skill);
}

function toast(msg, isErr) {
  let t = $("#toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    document.body.appendChild(t);
  }
  clearTimeout(t.dismissTimer);
  t.className = isErr ? "error" : "success";
  t.setAttribute("role", isErr ? "alert" : "status");
  t.setAttribute("aria-live", isErr ? "assertive" : "polite");
  t.innerHTML = isErr
    ? '<span class="toast-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke-width="2" stroke-linecap="round"/></svg></span>'
    : '<span class="toast-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4L19 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  const text = document.createElement("span");
  text.textContent = msg;
  t.appendChild(text);
  t.dismissTimer = setTimeout(() => t.remove(), 2500);
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

if (KEY) boot(); else showGate("");
</script>
